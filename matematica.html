<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogos de Matemática e Inglês</title>
<style>
:root{--bg:#f4f7fc;--surface:#fff;--ink:#16213a;--muted:#5b6785;--line:#dbe3f1;--brand:#1f4fd8;--brand2:#ff7a1a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#18203a;--ink:#eef2fc;--muted:#a3afcf;--line:#2a3558;--brand:#6c93ff;--brand2:#ff9a4d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.hero{background:linear-gradient(135deg,#1f4fd8,#6a3df0 60%,#ff7a1a);color:#fff;padding:44px 20px 70px;position:relative;overflow:hidden}
.hero .in{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px);line-height:1.1}
.hero p{margin:0;max-width:620px;font-size:clamp(15px,2.2vw,18px);opacity:.95}
.sym{position:absolute;font-weight:800;opacity:.13;user-select:none;pointer-events:none;font-size:90px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.badges span{background:#ffffff26;border:1px solid #ffffff55;border-radius:99px;padding:4px 12px;font-size:13px}
main{max-width:1000px;margin:-40px auto 40px;padding:0 16px;position:relative;z-index:2}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 8px 24px #1f4fd81a}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;font:600 14px inherit;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
section{margin-top:28px}
section h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:22px}
section h2 i{font-style:normal;display:inline-flex;width:38px;height:38px;border-radius:11px;align-items:center;justify-content:center;font-size:21px;background:var(--c);color:#fff}
section>p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #16213a22}
.card .em{font-size:34px;line-height:1}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--c);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 14px;margin-top:4px}
.play:hover{filter:brightness(1.1)}
.soon{border-style:dashed;opacity:.65;border-top-width:1.5px}
.soon .play{background:transparent;color:var(--muted);border:1.5px dashed var(--line);pointer-events:none}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}
@media (prefers-color-scheme:dark){.card:hover{box-shadow:0 10px 24px #0008}}
</style>
</head>
<body>
<div class="hero"><div class="in">
<h1>🎲 Jogos de Matemática e Inglês</h1>
<p>Arraste a resposta até o cartão certo, ganhe moedas e avance de fase. Funciona no computador e no Chromebook.</p>
<div class="badges"><span>🖱️ Arrastar ou clicar</span><span>⏱️ 10 segundos para conferir</span><span>🪙 +15 por acerto</span></div>
</div>
<span class="sym" style="left:4%;top:20px">+</span><span class="sym" style="right:6%;top:30px;font-size:120px">÷</span><span class="sym" style="left:46%;bottom:-18px;font-size:110px">×</span><span class="sym" style="right:30%;top:-10px">−</span>
</div>
<main>
<div class="bar" id="bar"></div>
<div id="out"></div>
<div class="empty" id="empty">Nada por aqui ainda.</div>
</main>
<footer>Prof. Rodrigo · Novos jogos entram aqui a cada atualização.</footer>
<script>
/* ===== COMO ATUALIZAR =====
   Para incluir um jogo novo: acrescente um objeto em JOGOS no tema certo
   (ou crie um tema novo em TEMAS). Para marcar como "em breve": soon:true e sem href. */
const TEMAS=[
 {id:'inteiros',nome:'Números inteiros',icon:'➕',cor:'#1f4fd8',desc:'Sinais, adição, subtração e multiplicação com números positivos e negativos.'},
 {id:'fracoes',nome:'Frações',icon:'🍕',cor:'#e8590c',desc:'Da figura pintada às contas com frações.'},
 {id:'dinheiro',nome:'Dinheiro',icon:'💰',cor:'#0f9d58',desc:'Contar moedas e cédulas, somar compras e dar o troco.'},
 {id:'porcentagem',nome:'Porcentagem',icon:'🔟',cor:'#c2185b',desc:'50%, 10% e 25%: metade, décima parte e um quarto, até os descontos da loja.'},
 {id:'ingles',nome:'Inglês',icon:'<svg viewBox="0 0 38 20" width="22" height="12" style="vertical-align:-1px;border-radius:2px"><rect width="38" height="20" fill="#fff"/><rect y="0.00" width="38" height="1.54" fill="#b22234"/><rect y="3.08" width="38" height="1.54" fill="#b22234"/><rect y="6.16" width="38" height="1.54" fill="#b22234"/><rect y="9.24" width="38" height="1.54" fill="#b22234"/><rect y="12.32" width="38" height="1.54" fill="#b22234"/><rect y="15.40" width="38" height="1.54" fill="#b22234"/><rect y="18.48" width="38" height="1.54" fill="#b22234"/><rect width="15.2" height="10.77" fill="#3c3b6e"/></svg>',cor:'#c62828',desc:'Vocabulário e gramática: ligue a frase ou o número à figura certa.'},
 {id:'algebra',nome:'Álgebra',icon:'🔤',cor:'#7c3aed',desc:'Incógnitas, termos semelhantes e expressões.'}
];
const JOGOS=[
 {tema:'inteiros',emoji:'🧮',titulo:'Soma de Inteiros',desc:'8 fases: somas, subtrações, três termos, letras (álgebra), contas com frutas, vezes e tabuada com sinais. Números de −5 a 15.',serie:'6º e 7º ano',fases:8,href:'soma-de-inteiros-jogo.html'},
 {tema:'fracoes',emoji:'🍰',titulo:'Frações',desc:'6 fases: fração em figuras (pizzas), soma e subtração com mesmo denominador, fração de um número, simplificação e frações com frutas.',serie:'6º ano',fases:6,href:'fracoes-jogo.html'},
 {tema:'dinheiro',emoji:'💰',titulo:'Contagem de Dinheiro',desc:'6 fases: arraste moedas e cédulas para pagar o valor exato, somar dois produtos e dar o troco com moedas e cédulas.',serie:'6º ano',fases:6,href:'contagem-dinheiro-jogo.html'},
 {tema:'dinheiro',emoji:'🏪',titulo:'Mercadinho',desc:'Você é o caixa! Os produtos passam no leitor com bipes, você soma os preços e entrega o troco. Tem som de caixa registradora. 5 fases.',serie:'6º ano',fases:5,href:'mercadinho-jogo.html'},
 {tema:'dinheiro',emoji:'🪙',titulo:'Dando o Troco',desc:'Troco de R$ 5, R$ 10, R$ 20, R$ 50 e R$ 100, até as compras com dois produtos. 6 fases.',serie:'6º ano',fases:6,href:'troco-jogo.html'},
 {tema:'dinheiro',emoji:'💵',titulo:'Contagem de Dólares',desc:'Moedas (cents) e notas (bills) americanas: pagar, somar compras e dar o troco em dólares. 6 fases.',serie:'6º ao 8º ano',fases:6,href:'contagem-dolares-jogo.html'},
 {tema:'porcentagem',emoji:'🔟',titulo:'Porcentagem Fácil',desc:'50% (metade), 10% (dividir por 10) e 25% (um quarto), misturas e descontos em reais. 6 fases.',serie:'6º ano',fases:6,href:'porcentagem-jogo.html'},
 {tema:'ingles',emoji:'🏃',titulo:'Phrasal Verbs',desc:'Ligue cada phrasal verb à figura que o representa. Arraste ou clique.',serie:'8º ano',href:'phrasal-verbs-jogo.html'},
 {tema:'ingles',emoji:'📍',titulo:'Prepositions of Place',desc:'in, on, under, next to, between... ligue a frase à figura certa.',serie:'6º ano',href:'preposicoes-de-lugar-jogo.html'},
 {tema:'ingles',emoji:'🔢',titulo:'English Numbers',desc:'Números cardinais e ordinais em inglês: ligue o número escrito à sua forma.',serie:'6º ano',href:'numbers-ingles-jogo.html'},
 {tema:'algebra',emoji:'🔢',titulo:'Álgebra com letras',desc:'Já está nas fases 2 e 5 do jogo Soma de Inteiros. Uma versão só de álgebra vem aí.',serie:'7º ano',soon:true}
];
let filtro='todos';
const bar=document.getElementById('bar'),out=document.getElementById('out'),empty=document.getElementById('empty');
function chips(){
 bar.innerHTML='';
 [{id:'todos',nome:'Todos'},...TEMAS.filter(t=>JOGOS.some(j=>j.tema===t.id))].forEach(t=>{
  const b=document.createElement('button');b.className='chip'+(filtro===t.id?' on':'');b.innerHTML=(t.icon?t.icon+' ':'')+t.nome;
  b.onclick=()=>{filtro=t.id;chips();draw()};bar.appendChild(b)})}
function draw(){
 out.innerHTML='';let n=0;
 TEMAS.forEach(t=>{
  if(filtro!=='todos'&&filtro!==t.id)return;
  const js=JOGOS.filter(j=>j.tema===t.id);if(!js.length)return;
  const s=document.createElement('section');s.style.setProperty('--c',t.cor);
  s.innerHTML='<h2><i>'+t.icon+'</i>'+t.nome+'</h2><p>'+t.desc+'</p>';
  const g=document.createElement('div');g.className='grid';
  js.forEach(j=>{n++;
   const c=document.createElement('div');c.className='card'+(j.soon?' soon':'');c.style.setProperty('--c',t.cor);
   c.innerHTML='<div class="em">'+j.emoji+'</div><h3>'+j.titulo+'</h3><div class="tags"><span>'+j.serie+'</span>'+(j.fases?'<span>'+j.fases+' fases</span>':'')+(j.soon?'<span>em breve</span>':'')+'</div><p>'+j.desc+'</p>'+
    (j.soon?'<span class="play">Em breve</span>':'<a class="play" href="'+j.href+'">▶ Jogar</a>');
   g.appendChild(c)});
  s.appendChild(g);out.appendChild(s)});
 empty.style.display=n?'none':'block'}
chips();draw();
</script>
</body>
</html>
